<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRIMAQ | Soporte Técnico y Manuales</title>
    <meta name="description" content="Acceso a manuales de usuario, instructivo de mantenimiento y servicio técnico oficial de Frimaq Heladeras Comerciales.">
    
    <!-- Tipografía Corporativa: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (Motor de renderizado) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración del ADN Visual -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#284766',  
                            light: '#2688BB', 
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 8s linear infinite', /* Motor de Animación a 8s (Turbina/Copo) */
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Optimizaciones B2B y Motor de Animación */
        body { 
            -webkit-tap-highlight-color: transparent; 
            margin: 0;
            background-color: #f0f4f8;
        }

        /* IDENTIDAD VISUAL DEL QR: Círculos geométricos tenues en las esquinas */
        body::before, body::after {
            content: '';
            position: fixed;
            border: 2px solid rgba(38, 136, 187, 0.15); /* #2688BB (brand-light) tenue */
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        body::before {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
        }

        body::after {
            width: 450px;
            height: 450px;
            bottom: -150px;
            right: -150px;
        }

        /* Cryo-Mesh Gradient: Efecto visual de aire frío + Gradiente radial sutil */
        .cryo-mesh-bg {
            background: 
                radial-gradient(circle at top left, rgba(255,255,255,0.8) 0%, transparent 60%),
                linear-gradient(-45deg, #e2eaf4, #ffffff, #c9dff0, #d5e6f5);
            background-size: 400% 400%, 400% 400%;
            animation: gradientMove 15s ease infinite;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -2;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism de Alta Fidelidad */
        .glass-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(40, 71, 102, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(38, 136, 187, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 12px 36px 0 rgba(40, 71, 102, 0.12);
        }

        .glass-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.75);
        }

        /* SISTEMA DE PARTÍCULAS DE NIEVE */
        @keyframes cryoFloat {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.12; }
            50% { transform: translateY(50vh) translateX(30px) rotate(180deg); opacity: 0.12; }
            90% { opacity: 0.12; }
            100% { transform: translateY(110vh) translateX(-20px) rotate(360deg); opacity: 0; }
        }

        .cryo-particle {
            position: absolute;
            color: #2688BB; 
            pointer-events: none; 
            opacity: 0; 
            animation: cryoFloat linear infinite;
        }

        .particle-1 { left: 15vw; top: -10vh; width: 64px; height: 64px; animation-duration: 24s; animation-delay: 0s; }
        .particle-2 { left: 45vw; top: -10vh; width: 32px; height: 32px; animation-duration: 20s; animation-delay: 4s; }
        .particle-3 { left: 80vw; top: -10vh; width: 64px; height: 64px; animation-duration: 28s; animation-delay: 2s; }
        .particle-4 { left: 10vw; top: -10vh; width: 32px; height: 32px; animation-duration: 18s; animation-delay: -6s; }
        .particle-5 { left: 65vw; top: -10vh; width: 64px; height: 64px; animation-duration: 26s; animation-delay: -14s; }
        .particle-6 { left: 30vw; top: -10vh; width: 32px; height: 32px; animation-duration: 22s; animation-delay: -20s; }

        /* Estilos del Logo */
        .cls-1 { fill: #2c4563; stroke-width: 0px; }
        .cls-2 { fill: #53b6e7; stroke-width: 0px; }
    </style>
</head>
